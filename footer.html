<!-- KodiniTools Footer Partial -->
<!-- Mit i18n Synchronisation -->

<style>
/* Farben: App-Tokens, wenn die Seite sie definiert, sonst Fallbacks der Navy/Gold-Palette */
.site-footer {
    --kt-surface: var(--surface, #ffffff);
    --kt-tint: var(--surface-tint, #f5efdc);
    --kt-text: var(--text-primary, #003971);
    --kt-text-2: var(--text-secondary, #2d4459);
    --kt-primary: var(--primary-color, #014f99);
    --kt-primary-hover: var(--primary-hover, #003971);
    --kt-on-primary: var(--on-primary, #f5f4d6);
    --kt-border: var(--border, #e4dcc4);
    --kt-border-strong: var(--border-strong, #8a7a55);
    --kt-focus: var(--border-focus, #014f99);
    --kt-shadow: var(--shadow-card, 0 1px 2px rgba(0, 57, 113, 0.06), 0 16px 32px -16px rgba(0, 57, 113, 0.22));
    --kt-radius: var(--radius, 10px);
    --kt-radius-lg: var(--radius-lg, 16px);
    --kt-font: var(--font-main, 'Supreme', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
    --kt-transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}

[data-theme="dark"] .site-footer,
[data-theme="contrast-dark"] .site-footer {
    --kt-surface: var(--surface, #142640);
    --kt-tint: var(--surface-tint, #0e1c32);
    --kt-text: var(--text-primary, #f9f2d5);
    --kt-text-2: var(--text-secondary, #f8e1a9);
    --kt-primary: var(--primary-color, #c9984d);
    --kt-primary-hover: var(--primary-hover, #f8e1a9);
    --kt-on-primary: var(--on-primary, #091428);
    --kt-border: var(--border, #1e3a5a);
    --kt-border-strong: var(--border-strong, #5a7a96);
    --kt-focus: var(--border-focus, #c9984d);
    --kt-shadow: var(--shadow-card, 0 1px 2px rgba(0, 0, 0, 0.4), 0 20px 40px -16px rgba(0, 0, 0, 0.7));
}

.site-footer {
  background: var(--kt-surface);
  color: var(--kt-text);
  border-top: 1px solid var(--kt-border);
  padding: 1.5rem 2rem;
  margin-top: 2rem;
  font-family: var(--kt-font);
}

.footer-content {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.footer-links {
  display: flex;
  gap: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
}

.footer-link {
  color: var(--kt-text-2);
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1.5;
  transition: var(--kt-transition);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  padding: 0;
}

.footer-link:hover {
  color: var(--kt-primary);
  text-decoration: underline;
}

.footer-link:focus-visible {
  outline: 2px solid var(--kt-focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.social-link {
  display: inline-flex;
  align-items: center;
}

.social-icon {
  width: 1rem;
  height: 1rem;
}

.footer-copyright {
  color: var(--kt-text-2);
  font-size: 0.8125rem;
  margin: 0;
}

@media (max-width: 768px) {
  .site-footer {
    padding: 1.25rem 1rem;
  }
  .footer-links {
    gap: 1rem;
  }
}

@media (max-width: 480px) {
  .footer-links {
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
}
</style>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-links">
      <a href="https://kodinitools.com/datenschutz/" class="footer-link" data-i18n="footer.privacy">Datenschutz</a>
      <a href="https://kodinitools.com/kontaktformular/" class="footer-link" data-i18n="footer.contact">Kontakt</a>
      <button class="footer-link" onclick="CookieConsent.showSettings()" data-i18n="footer.cookieSettings">Cookie-Einstellungen</button>
      <a href="https://www.facebook.com/KodiniTools" target="_blank" rel="noopener noreferrer" class="footer-link social-link" aria-label="Facebook">
        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </a>
    </div>
    <p class="footer-copyright">&copy; <script>document.write(new Date().getFullYear())</script> KodiniTools</p>
  </div>
</footer>

<script>
// Footer i18n
(function() {
  'use strict';

  var FOOTER_TRANSLATIONS = {
    de: {
      'footer.privacy': 'Datenschutz',
      'footer.contact': 'Kontakt',
      'footer.cookieSettings': 'Cookie-Einstellungen'
    },
    en: {
      'footer.privacy': 'Privacy Policy',
      'footer.contact': 'Contact',
      'footer.cookieSettings': 'Cookie Settings'
    }
  };

  function applyFooterTranslations() {
    var lang = localStorage.getItem('locale') || 'de';
    var t = FOOTER_TRANSLATIONS[lang] || FOOTER_TRANSLATIONS['de'];
    var footer = document.querySelector('.site-footer');
    if (!footer) return;
    footer.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      if (t[key]) el.textContent = t[key];
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyFooterTranslations);
  } else {
    applyFooterTranslations();
  }

  // Live-Update bei Sprachwechsel (ohne Reload)
  window.addEventListener('locale-changed', applyFooterTranslations);
})();
</script>
